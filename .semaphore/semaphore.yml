version: v1.0
name: Terraform Exercises
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout

blocks:
  # ── Shared initialization for all exercises ──────────────────────────────
  - name: Initialize
    dependencies: []
    task:
      secrets:
        - name: localstack
      jobs:
        - name: terraform init + validate all
          commands:
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - export TF_VAR_aws_endpoint="http://localhost:4566"
            - cd 1-terraform-apply && terraform init && terraform validate && cd ..
            - cd 2-terraform-ec2 && terraform init && terraform validate && cd ..
            - cd 3-terraform-dynamodb && terraform init && terraform validate && cd ..
            - tar czf ex1-plugins.tar.gz -C 1-terraform-apply .terraform
            - tar czf ex2-plugins.tar.gz -C 2-terraform-ec2 .terraform
            - tar czf ex3-plugins.tar.gz -C 3-terraform-dynamodb .terraform
            - artifact push workflow ex1-plugins.tar.gz --destination ex1/terraform-plugins.tar.gz
            - artifact push workflow ex2-plugins.tar.gz --destination ex2/terraform-plugins.tar.gz
            - artifact push workflow ex3-plugins.tar.gz --destination ex3/terraform-plugins.tar.gz
            - artifact push workflow 1-terraform-apply/.terraform.lock.hcl --destination ex1/terraform.lock.hcl
            - artifact push workflow 2-terraform-ec2/.terraform.lock.hcl --destination ex2/terraform.lock.hcl
            - artifact push workflow 3-terraform-dynamodb/.terraform.lock.hcl --destination ex3/terraform.lock.hcl

  # ── Exercise 1: S3 Bucket ────────────────────────────────────────────────
  - name: "Ex1: Deploy"
    dependencies:
      - Initialize
    task:
      secrets:
        - name: localstack
      jobs:
        - name: terraform apply
          commands:
            - cd 1-terraform-apply
            - docker rm -f localstack >/dev/null 2>&1 || true
            - docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns localstack/localstack:3
            - sleep 20
            - curl -fsS http://localhost:4566/_localstack/health
            - artifact pull workflow ex1/terraform-plugins.tar.gz --destination ex1-plugins.tar.gz
            - artifact pull workflow ex1/terraform.lock.hcl --destination .terraform.lock.hcl
            - tar xzf ex1-plugins.tar.gz
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - export TF_VAR_aws_endpoint="http://localhost:4566"
            - terraform apply -no-color -auto-approve
            - artifact push workflow terraform.tfstate --destination ex1/terraform.tfstate

  - name: "Ex1: Use Bucket"
    dependencies:
      - "Ex1: Deploy"
    task:
      secrets:
        - name: localstack
      jobs:
        - name: s3 operations
          commands:
            - cd 1-terraform-apply
            - docker rm -f localstack >/dev/null 2>&1 || true
            - docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns localstack/localstack:3
            - sleep 20
            - curl -fsS http://localhost:4566/_localstack/health
            - artifact pull workflow ex1/terraform-plugins.tar.gz --destination ex1-plugins.tar.gz
            - artifact pull workflow ex1/terraform.lock.hcl --destination .terraform.lock.hcl
            - artifact pull workflow ex1/terraform.tfstate --destination terraform.tfstate --force
            - tar xzf ex1-plugins.tar.gz
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - export TF_VAR_aws_endpoint="http://localhost:4566"
            - 'export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - terraform apply -no-color -auto-approve
            - aws --endpoint-url=http://localhost:4566 s3 cp README.md s3://bucket-mcbucket/
            - aws --endpoint-url=http://localhost:4566 s3 ls s3://bucket-mcbucket
            - aws --endpoint-url=http://localhost:4566 s3 rm s3://bucket-mcbucket/README.md
            - artifact push workflow terraform.tfstate --destination ex1/terraform.tfstate --force

  - name: "Ex1: Destroy"
    dependencies:
      - "Ex1: Use Bucket"
    task:
      secrets:
        - name: localstack
      jobs:
        - name: terraform destroy
          commands:
            - cd 1-terraform-apply
            - docker rm -f localstack >/dev/null 2>&1 || true
            - docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns localstack/localstack:3
            - sleep 20
            - curl -fsS http://localhost:4566/_localstack/health
            - artifact pull workflow ex1/terraform-plugins.tar.gz --destination ex1-plugins.tar.gz
            - artifact pull workflow ex1/terraform.lock.hcl --destination .terraform.lock.hcl
            - artifact pull workflow ex1/terraform.tfstate --destination terraform.tfstate --force
            - tar xzf ex1-plugins.tar.gz
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - export TF_VAR_aws_endpoint="http://localhost:4566"
            - terraform apply -no-color -auto-approve
            - terraform destroy -no-color -auto-approve

  # ── Exercise 2: EC2 Instance ─────────────────────────────────────────────
  - name: "Ex2: Deploy"
    dependencies:
      - Initialize
    task:
      secrets:
        - name: localstack
      jobs:
        - name: terraform apply
          commands:
            - cd 2-terraform-ec2
            - docker rm -f localstack >/dev/null 2>&1 || true
            - docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns localstack/localstack:3
            - sleep 20
            - curl -fsS http://localhost:4566/_localstack/health
            - artifact pull workflow ex2/terraform-plugins.tar.gz --destination ex2-plugins.tar.gz
            - artifact pull workflow ex2/terraform.lock.hcl --destination .terraform.lock.hcl
            - tar xzf ex2-plugins.tar.gz
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - export TF_VAR_aws_endpoint="http://localhost:4566"
            - terraform apply -no-color -auto-approve
            - artifact push workflow terraform.tfstate --destination ex2/terraform.tfstate

  - name: "Ex2: Destroy"
    dependencies:
      - "Ex2: Deploy"
    task:
      secrets:
        - name: localstack
      jobs:
        - name: terraform destroy
          commands:
            - cd 2-terraform-ec2
            - docker rm -f localstack >/dev/null 2>&1 || true
            - docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns localstack/localstack:3
            - sleep 20
            - curl -fsS http://localhost:4566/_localstack/health
            - artifact pull workflow ex2/terraform-plugins.tar.gz --destination ex2-plugins.tar.gz
            - artifact pull workflow ex2/terraform.lock.hcl --destination .terraform.lock.hcl
            - artifact pull workflow ex2/terraform.tfstate --destination terraform.tfstate
            - tar xzf ex2-plugins.tar.gz
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - export TF_VAR_aws_endpoint="http://localhost:4566"
            - terraform apply -no-color -auto-approve
            - terraform destroy -no-color -auto-approve

  # ── Exercise 3: DynamoDB Table ───────────────────────────────────────────
  - name: "Ex3: Deploy"
    dependencies:
      - Initialize
    task:
      secrets:
        - name: localstack
      jobs:
        - name: terraform apply
          commands:
            - cd 3-terraform-dynamodb
            - docker rm -f localstack >/dev/null 2>&1 || true
            - docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns,dynamodb localstack/localstack:3
            - sleep 20
            - curl -fsS http://localhost:4566/_localstack/health
            - artifact pull workflow ex3/terraform-plugins.tar.gz --destination ex3-plugins.tar.gz
            - artifact pull workflow ex3/terraform.lock.hcl --destination .terraform.lock.hcl
            - tar xzf ex3-plugins.tar.gz
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - export TF_VAR_aws_endpoint="http://localhost:4566"
            - terraform apply -no-color -auto-approve
            - artifact push workflow terraform.tfstate --destination ex3/terraform.tfstate

  - name: "Ex3: Use Table"
    dependencies:
      - "Ex3: Deploy"
    task:
      secrets:
        - name: localstack
      jobs:
        - name: dynamodb operations
          commands:
            - cd 3-terraform-dynamodb
            - docker rm -f localstack >/dev/null 2>&1 || true
            - docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns,dynamodb localstack/localstack:3
            - sleep 20
            - curl -fsS http://localhost:4566/_localstack/health
            - artifact pull workflow ex3/terraform-plugins.tar.gz --destination ex3-plugins.tar.gz
            - artifact pull workflow ex3/terraform.lock.hcl --destination .terraform.lock.hcl
            - artifact pull workflow ex3/terraform.tfstate --destination terraform.tfstate
            - tar xzf ex3-plugins.tar.gz
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - export TF_VAR_aws_endpoint="http://localhost:4566"
            - 'export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - terraform apply -no-color -auto-approve
            - aws --endpoint-url=http://localhost:4566 dynamodb list-tables
            - aws --endpoint-url=http://localhost:4566 dynamodb describe-table --table-name devops-training-table
            - "aws --endpoint-url=http://localhost:4566 dynamodb put-item --table-name devops-training-table --item '{\"user_id\": {\"S\": \"u1\"}, \"name\": {\"S\": \"Alice\"}, \"email\": {\"S\": \"alice@example.com\"}}'"
            - aws --endpoint-url=http://localhost:4566 dynamodb scan --table-name devops-training-table
            - artifact push workflow terraform.tfstate --destination ex3/terraform.tfstate --force

  - name: "Ex3: Destroy"
    dependencies:
      - "Ex3: Use Table"
    task:
      secrets:
        - name: localstack
      jobs:
        - name: terraform destroy
          commands:
            - cd 3-terraform-dynamodb
            - docker rm -f localstack >/dev/null 2>&1 || true
            - docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns,dynamodb localstack/localstack:3
            - sleep 20
            - curl -fsS http://localhost:4566/_localstack/health
            - artifact pull workflow ex3/terraform-plugins.tar.gz --destination ex3-plugins.tar.gz
            - artifact pull workflow ex3/terraform.lock.hcl --destination .terraform.lock.hcl
            - artifact pull workflow ex3/terraform.tfstate --destination terraform.tfstate
            - tar xzf ex3-plugins.tar.gz
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - export TF_VAR_aws_endpoint="http://localhost:4566"
            - terraform apply -no-color -auto-approve
            - terraform destroy -no-color -auto-approve
