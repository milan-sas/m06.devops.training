version: v1.0
name: "Terraform S3 Exercise"

agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404

fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'

blocks:
  - name: "Initialize"
    dependencies: []
    task:
      secrets:
        - name: localstack
      jobs:
        - name: "terraform init"
          commands:
            - cd 1-terraform-apply
            - terraform init
            - artifact push workflow .terraform
            - artifact push workflow .terraform.lock.hcl

  - name: "Deploy"
    dependencies: ["Initialize"]
    task:
      secrets:
        - name: localstack
      jobs:
        - name: "terraform apply"
          commands:
            - cd 1-terraform-apply
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - export TF_VAR_AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export TF_VAR_AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export TF_VAR_AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
            - terraform validate
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate

  - name: "Use Bucket"
    dependencies: ["Deploy"]
    task:
      secrets:
        - name: localstack
      jobs:
        - name: "s3 operations"
          commands:
            - aws s3 cp 1-terraform-apply/README.md s3://my-test-bucket/ --endpoint-url http://devops.tomfern.com:31566
            - aws s3 ls s3://my-test-bucket --endpoint-url http://devops.tomfern.com:31566
            - aws s3 rm s3://my-test-bucket/README.md --endpoint-url http://devops.tomfern.com:31566

  - name: "Destroy"
    dependencies: ["Use Bucket"]
    task:
      secrets:
        - name: localstack
      jobs:
        - name: "terraform destroy"
          commands:
            - cd 1-terraform-apply
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - artifact pull workflow terraform.tfstate
            - export TF_VAR_AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export TF_VAR_AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export TF_VAR_AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
            - terraform destroy -auto-approve
