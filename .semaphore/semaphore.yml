version: v1.0
name: Terraform S3 Exercise
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Initialize
    dependencies: []
    task:
      secrets:
        - name: localstack
      jobs:
        - name: terraform init + validate
          commands:
            - cd 1-terraform-apply
            - docker rm -f localstack >/dev/null 2>&1 || true
            - 'docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns localstack/localstack:3'
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - 'export TF_VAR_aws_endpoint="http://localhost:4566"'
            - terraform init
            - terraform validate
            - tar czf terraform-plugins.tar.gz .terraform
            - artifact push workflow terraform-plugins.tar.gz
            - artifact push workflow .terraform.lock.hcl
  - name: Deploy
    dependencies:
      - Initialize
    task:
      secrets:
        - name: localstack
      jobs:
        - name: terraform apply
          commands:
            - cd 1-terraform-apply
            - docker rm -f localstack >/dev/null 2>&1 || true
            - 'docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns localstack/localstack:3'
            - sleep 20
            - 'curl -fsS http://localhost:4566/_localstack/health'
            - artifact pull workflow terraform-plugins.tar.gz
            - artifact pull workflow .terraform.lock.hcl
            - tar xzf terraform-plugins.tar.gz
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - 'export TF_VAR_aws_endpoint="http://localhost:4566"'
            - terraform apply -no-color -auto-approve
            - artifact push workflow terraform.tfstate --force
  - name: Use Bucket
    dependencies:
      - Deploy
    task:
      secrets:
        - name: localstack
      jobs:
        - name: s3 operations
          commands:
            - cd 1-terraform-apply
            - docker rm -f localstack >/dev/null 2>&1 || true
            - 'docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns localstack/localstack:3'
            - sleep 20
            - 'curl -fsS http://localhost:4566/_localstack/health'
            - artifact pull workflow terraform-plugins.tar.gz
            - artifact pull workflow .terraform.lock.hcl
            - artifact pull workflow terraform.tfstate --force
            - tar xzf terraform-plugins.tar.gz
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - 'export TF_VAR_aws_endpoint="http://localhost:4566"'
            - 'export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - terraform apply -no-color -auto-approve
            - 'aws --endpoint-url=http://localhost:4566 s3 cp README.md s3://bucket-mcbucket/'
            - 'aws --endpoint-url=http://localhost:4566 s3 ls s3://bucket-mcbucket'
            - 'aws --endpoint-url=http://localhost:4566 s3 rm s3://bucket-mcbucket/README.md'
            - artifact push workflow terraform.tfstate --force
  - name: Destroy
    dependencies:
      - Use Bucket
    task:
      secrets:
        - name: localstack
      jobs:
        - name: terraform destroy
          commands:
            - cd 1-terraform-apply
            - docker rm -f localstack >/dev/null 2>&1 || true
            - 'docker run -d --name localstack -p 4566:4566 -e SERVICES=s3,sts,iam,ec2,sqs,sns localstack/localstack:3'
            - sleep 20
            - 'curl -fsS http://localhost:4566/_localstack/health'
            - artifact pull workflow terraform-plugins.tar.gz
            - artifact pull workflow .terraform.lock.hcl
            - artifact pull workflow terraform.tfstate --force
            - tar xzf terraform-plugins.tar.gz
            - export TF_INPUT=0
            - 'export TF_VAR_AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"'
            - 'export TF_VAR_AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"'
            - 'export TF_VAR_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"'
            - 'export TF_VAR_aws_endpoint="http://localhost:4566"'
            - terraform apply -no-color -auto-approve
            - terraform destroy -no-color -auto-approve
